<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bagaga Bypass</title>
<style>
*{box-sizing:border-box}
body{
margin:0;background:#080b16;color:white;
font-family:Arial,sans-serif;min-height:100vh;
display:flex;align-items:center;justify-content:center;
padding:20px;
}
.card{
width:100%;max-width:420px;padding:30px;
background:#141b2d;border:1px solid #29385d;
border-radius:20px;text-align:center;
box-shadow:0 0 35px #386aff30;
}
h1{color:#6592ff;font-size:30px}
p{color:#9ba9c8}
input,button{
width:100%;padding:15px;margin-top:15px;
border-radius:10px;font-size:15px;
}
input{
background:#080e1e;color:white;
border:1px solid #34466c;
}
button{
background:#4778ff;color:white;
border:0;font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.6}
#result{margin-top:20px;color:#8eb0ff;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="card">
<h1>BAGAGA BYPASS</h1>
<p>DELTA KEY SYSTEM</p>
<input id="link" type="url"
placeholder="Paste your LootLabs link">
<button id="getKey" onclick="getKey()">GET KEY</button>
<div id="result" role="status"></div>
</div>

<script>
async function getKey(){
  const input = document.getElementById('link');
  const button = document.getElementById('getKey');
  const result = document.getElementById('result');
  const link = input.value.trim();

  let url;
  try {
    url = new URL(link);
  } catch {
    result.textContent = 'Please enter a valid URL.';
    return;
  }

  if (url.protocol !== 'https:' ||
      url.hostname !== 'links.lootlabs.gg') {
    result.textContent = 'Please enter a valid LootLabs link.';
    return;
  }

  result.textContent =
    'Link accepted. Waiting for official task verification.';
  button.disabled = true;

  try {
    const response = await fetch('/api/lootlabs', {
      method: 'GET',
      headers: {'Accept': 'application/json'}
    });

    if (!response.ok) {
      throw new Error('Verification service is not ready.');
    }

    result.textContent =
      'The server is reachable, but task verification and key issuance must be configured.';
  } catch (error) {
    result.textContent =
      'Verification is not configured yet. Please try again later.';
  } finally {
    button.disabled = false;
  }
}
</script>
</body>
</html>
